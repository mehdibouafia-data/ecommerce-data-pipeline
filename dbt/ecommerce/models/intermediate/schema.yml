version: 2
 
models:
  - name: int_orders_enriched
    description: >
      Joins cart_items + carts + products.
      Granularity: 1 line per order item.
      Populates mart_sales and mart_products.
    columns:
      - name: cart_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: user_id
        tests: [not_null]
      - name: quantity
        tests: [not_null]
      - name: unit_price
        tests: [not_null]
 
  - name: int_customers_orders
    description: >
      Joins users + carts.
      Granularity: 1 line per order per customer.
      Populates mart_customers.
    columns:
      - name: user_id
        tests: [not_null]
      - name: cart_id
        tests: [not_null, unique]
      - name: email
        tests: [not_null]
      - name: cart_total
        tests: [not_null]
