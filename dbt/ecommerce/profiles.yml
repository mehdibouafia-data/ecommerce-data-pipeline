ecommerce:
  target: postgres # default target — overridden by the DAG depending on the layer
  outputs:

    # ── PostgreSQL (staging + intermediate) ──────────────
    postgres:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT') | int }}"
      user: "{{ env_var('POSTGRES_ECOMMERCE_USER') }}"
      password: "{{ env_var('POSTGRES_ECOMMERCE_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_ECOMMERCE_DB') }}"
      schema: staging   # default schema — overridden by +schema in dbt_project.yml
      threads: 4

    # ── BigQuery (marts) ──────────────────────────────────
    bigquery:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('GCP_DATASET_MARTS') }}"
      threads: 4
      timeout_seconds: 300
      location: EU

    # ── DuckDB (CI) ───────────────────────────────────────
    ci:
      type: duckdb
      path: /tmp/ecommerce_ci.duckdb
      threads: 4