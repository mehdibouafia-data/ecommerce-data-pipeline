name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ─────────────────────────────────────────
  # LINT PYTHON
  # ─────────────────────────────────────────
  lint:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/ tests/

  # ─────────────────────────────────────────
  # PYTEST UNIT TESTS
  # ─────────────────────────────────────────
  tests:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  # ─────────────────────────────────────────
  # DBT COMPILE
  # Checks SQL syntax without executing
  # ─────────────────────────────────────────
  dbt-compile:
    name: dbt compile
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dbt
        run: pip install dbt-core dbt-duckdb

      - name: dbt compile
        working-directory: dbt/ecommerce
        run: dbt compile --profiles-dir . --target ci

  # ─────────────────────────────────────────
  # VALIDATE DOCKER COMPOSE 
  # Validates the syntax of the docker-compose.yml file
  # ─────────────────────────────────────────
  docker-compose-validate:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Create minimal .env for validation
        run: cp .env.example .env

      - name: Validate docker-compose syntax
        run: docker compose config

  # ─────────────────────────────────────────
  # BUILD DOCKER IMAGES
  # Validates that the Dockerfiles are valid
  # ─────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [tests, docker-compose-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Build ingestion image
        run: docker build -t ecommerce_ingestion:ci src/ingestion/

      - name: Build dbt image
        run: docker build -t ecommerce_dbt:ci dbt/

      - name: Build load image
        run: docker build -t ecommerce_load:ci src/load/